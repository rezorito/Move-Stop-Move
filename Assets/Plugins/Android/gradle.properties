org.gradle.jvmargs=-Xmx6144m -XX:MaxPermSize=2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
android.enableDexingArtifactTransform=true
kotlin.code.style=official
android.enableMultiDex=true

